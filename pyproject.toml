[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mintcdr"
version = "0.1.0"
description = "Code for MINTCDR cross-domain recommendation experiments."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "MINTCDR Authors"}]
dependencies = [
  "torch>=2.0",
  "numpy>=1.23",
  "PyYAML>=6.0",
  "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
text = ["transformers>=4.38"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

